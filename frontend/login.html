<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header class="header-main">
        <script src="header.js"></script>
    </header>
    <main class="login-main">
        <h1>LOG IN</h1>
        <div id="login-container" class="login-wrapper">
            <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="text" id="email" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required />
                <p><a href="forgotpassword.html">Forgot your password?</a></p>
            </div>
            <button type="submit">Log in</button>
            <p>Dont have an account? <a href="register.html">Sign up</a> here!</p>
            </form>
        </div>
    </main>
    <footer class="footer-main">
        <script src="footer.js"></script>
    </footer>
</body>
</html>
